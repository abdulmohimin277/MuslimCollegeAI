name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'sw.js'
      - 'app.js'
      - 'manifest.webmanifest'
      - 'android/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # android-actions/setup-android@v3 is intentionally NOT used: it pins a
      # cmdline-tools zip that dl.google.com now returns 404 for
      # (see android-actions/setup-android#513). The runner image already ships
      # platforms;android-36 and build-tools;36.0.0 preinstalled, so this step
      # only re-verifies them (a no-op when present).
      - name: Verify Android SDK 36
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null
          else
            echo "sdkmanager not found; relying on the SDK preinstalled at $ANDROID_HOME"
          fi

      - name: Cache Gradle + AAPT caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/**/gradle.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: muslim-college-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error